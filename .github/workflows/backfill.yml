name: Backfill GEO release pages

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated tags, oldest first (for example v0.8.1,v0.8.2). Defaults to the latest release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fanbar-geo-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          tags="${INPUT_TAGS:-}"
          if [ -z "$tags" ]; then
            tags="$(gh release view --repo helson-lin/FanBar --json tagName --jq .tagName)"
          fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build each tag in order
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.tags.outputs.value }}
        run: |
          IFS=',' read -ra list <<< "$TAGS"
          for tag in "${list[@]}"; do
            tag="$(echo "$tag" | xargs)"
            [ -z "$tag" ] && continue
            rm -rf fanbar
            git clone --depth 1 --branch "$tag" https://github.com/helson-lin/FanBar.git fanbar
            node scripts/build-release.mjs --src "$GITHUB_WORKSPACE/fanbar/docs/releases" --tag "$tag"
            node scripts/validate-build.mjs --version "${tag#v}"
          done

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.113.0"
          command: deploy
