name: Promote GEO pages to production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.8.2"
        required: true
        type: string
      confirm:
        description: "Type production to confirm the production deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fanbar-geo-production
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.confirm == 'production'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the site baseline and generator
        uses: actions/checkout@v4

      - name: Check out FanBar release notes at the tag
        uses: actions/checkout@v4
        with:
          repository: helson-lin/FanBar
          ref: ${{ inputs.tag }}
          path: fanbar
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release pages and GEO files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/build-release.mjs --src "$GITHUB_WORKSPACE/fanbar/docs/releases" --tag "$RELEASE_TAG"

      - name: Validate generated output
        run: node scripts/validate-build.mjs --version "${{ inputs.tag }}"

      - name: Deploy to the production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.113.0"
          command: deploy
